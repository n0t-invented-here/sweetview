[package]
name = "web-app-tauri"
version = "0.1.0"
description = "The web-app demo's page in a Tauri 2 shell, answered by a Rust backend over the Sweetview IPC frames"
edition = "2021"
license = "MIT OR 0BSD"
publish = false

# Its own workspace, so this demo never joins a Cargo workspace at the repository root.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
