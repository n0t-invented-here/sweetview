[package]
name = "spike"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
tao = "0.38"
wry = "0.58"
tray-icon = "0.27"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 1
debug = false
