[package]
name = "sweetview-napi"
description = "The binding: where JavaScript values and functions are converted and handed to the runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The webview's calls (`engine`): the binding of `@n1h/sweetview` has them (D50).
default = ["webview"]
webview = ["sweetview-runtime/webview"]

[dependencies]
napi.workspace = true
napi-derive.workspace = true
sweetview-runtime.workspace = true
