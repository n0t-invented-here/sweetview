[package]
name = "sweetview-runtime"
description = "Everything that lives on Sweetview's UI thread, with no JavaScript in sight."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The webview engine (`engine`, `bridge`): the binding of `@n1h/sweetview` has it, the native
# package's binding does not (D48).
default = ["webview"]
webview = ["dep:wry", "dep:sweetview-platform-webview", "dep:webview2-com"]

[dependencies]
sweetview-platform-input.workspace = true
sweetview-platform-loop.workspace = true
sweetview-platform-notify.workspace = true
sweetview-platform-shell.workspace = true
sweetview-platform-webview = { workspace = true, optional = true }
sweetview-platform-window.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tao.workspace = true
sweetview-window-logic.workspace = true
raw-window-handle.workspace = true
wry = { workspace = true, optional = true }
ico.workspace = true
muda.workspace = true
tray-icon.workspace = true

[target.'cfg(windows)'.dependencies]
webview2-com = { workspace = true, optional = true }

[target.'cfg(not(windows))'.dependencies]
rfd.workspace = true

[dev-dependencies]
sweetview-platform-window = { workspace = true, features = ["test-support"] }

# Runs itself as a child process whose main thread is the UI thread, as an application's is.
[[test]]
name = "exit_with_timer"
harness = false
