[package]
name = "sweetview-platform-window"
description = "The window-level OS calls tao has no API for, and the events of any window by subclass."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `test_support`: reads back what the OS shows, for the tests of crates that
# depend on this one. Enabled only as a dev-dependency.
test-support = ["windows/Win32_Graphics_Dwm", "windows/Win32_System_Com", "windows/Win32_System_Console", "windows/Win32_System_Memory"]

[dependencies]
tao.workspace = true
muda.workspace = true
raw-window-handle.workspace = true
sweetview-window-logic.workspace = true
sweetview-platform-loop.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "UI",
  "UI_ViewManagement",
] }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Memory"] }
