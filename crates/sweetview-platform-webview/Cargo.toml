[package]
name = "sweetview-platform-webview"
description = "The webview on Windows, made as the C++ fork makes it, with what Sweetview adds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `test_support`: reads back from WebView2 what a person would see, for the
# tests of crates that build webviews with this one. Enabled only as a
# dev-dependency, so it is never in the binding an application loads.
test-support = []

[dependencies]
sweetview-http.workspace = true
sweetview-platform-window.workspace = true

[target.'cfg(windows)'.dependencies]
sweetview-platform-loop.workspace = true
dirs.workspace = true
webview2-com.workspace = true
windows-core.workspace = true
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tao.workspace = true
serde_json.workspace = true
# The crate's own read-back, for its integration tests only.
sweetview-platform-webview = { path = ".", features = ["test-support"] }

[target.'cfg(windows)'.dev-dependencies]
sweetview-platform-loop.workspace = true
webview2-com.workspace = true
