[package]
name = "sweetview-platform-node"
description = "The export table of the binding: the items that carry the #[napi] attribute."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# On: the binding `@n1h/sweetview` ships, with the webview. Off (`--no-default-features`): the
# binding `@n1h/sweetview-native` ships, which links no webview (D48).
default = ["webview"]
webview = ["sweetview-napi/webview", "sweetview-runtime/webview"]

[dependencies]
napi.workspace = true
napi-derive.workspace = true
sweetview-napi.workspace = true
sweetview-runtime.workspace = true

[build-dependencies]
napi-build.workspace = true
