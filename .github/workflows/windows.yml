name: windows

# Builds the Rust binding and runs every check on Windows.
# Hosted CI is not approved for use in this project: nothing starts this workflow by itself.
# It runs only when the owner starts it by hand.
on:
  workflow_dispatch:

# A newer run on the same branch replaces an older one.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v3

      - name: Install JavaScript dependencies
        run: bun install

      - name: Build the binding
        run: just native

      # Each check below runs whether or not an earlier one failed, so one run reports them all.
      - name: cargo test
        shell: pwsh
        run: |
          cargo test --workspace --no-fail-fast 2>&1 | Tee-Object -FilePath cargo-test-output.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $lines = Get-Content cargo-test-output.txt
            $lines | Select-String -Pattern '^test .* FAILED|panicked at|^error' | Select-Object -First 10 | ForEach-Object { "::error::$($_.Line)" }
            $lines | Select-String -Pattern 'assertion|left:|right:|^failures:|test result' | Select-Object -First 10 | ForEach-Object { "::warning::$($_.Line)" }
            $lines | Select-Object -Last 10 | ForEach-Object { "::notice::$_" }
            exit $code
          }

      - name: cargo clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: bun run typecheck
        if: ${{ !cancelled() }}
        run: bun run typecheck

      # A failure is repeated as annotations (failing tests first, then the tail of the output),
      # so it can be read from the run's summary page.
      - name: bun test
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          bun test 2>&1 | Tee-Object -FilePath test-output.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $lines = Get-Content test-output.txt
            $lines | Select-String -Pattern '\(fail\)|^error|panicked|Segmentation|SIGABRT' | Select-Object -First 10 | ForEach-Object { "::error::$($_.Line)" }
            $lines | Select-Object -Last 10 | ForEach-Object { "::warning::$_" }
            $lines | Select-String -Pattern 'pass$|fail$|skip$|Ran \d+ tests' | Select-Object -Last 6 | ForEach-Object { "::notice::$($_.Line)" }
            exit $code
          }
